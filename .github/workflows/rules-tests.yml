name: Parkour rules tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          mkdir -p build
          g++ -std=c++20 -Wall -Wextra -Werror -I Source/Parquele/Public Tests/ParkourRulesTests.cpp -o build/rules_tests
          ./build/rules_tests
